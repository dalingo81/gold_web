<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行情看板 · 导航</title>
<script src="/gold/echarts.min.js"></script>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --line:#e6e9f0; --line-soft:#f0f2f6;
    --tx:#1c2434; --tx2:#5c6679; --tx3:#98a1b3; --chip:#eef1f6;
    --up:#e13b3b; --down:#0da35c; --flat:#5c6679;
    --gold:#c9971f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--tx);padding:28px 20px 44px}
  .head{max-width:820px;margin:0 auto 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
        background:linear-gradient(145deg,#f7d774,#c9971f);color:#fff;font-size:24px;font-weight:700}
  .head h1{font-size:21px;font-weight:700}
  .head h1 small{font-size:13px;color:var(--tx3);font-weight:400;margin-left:8px}
  .spacer{flex:1}
  .clock{font-size:13px;color:var(--tx2);text-align:right;line-height:1.5}
  .clock .date{font-size:12px;color:var(--tx3)}
  .cards{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(max-width:600px){.cards{grid-template-columns:1fr}}
  .card{display:flex;align-items:flex-start;gap:15px;background:var(--card);border:1px solid var(--line);
        border-radius:15px;padding:20px;box-shadow:0 2px 6px rgba(20,28,45,.05);text-decoration:none;
        color:inherit;position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
  .card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(20,28,45,.09);border-color:#dfe4ec}
  .card .ic{width:52px;height:52px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
            font-size:26px;font-weight:700;color:#fff}
  .card.gold .ic{background:linear-gradient(145deg,#f7d774,#c9971f)}
  .card.ashare .ic{background:linear-gradient(145deg,#e8756a,#b03a3a)}
  .card .body{flex:1;min-width:0}
  .card .body .t{font-size:16.5px;font-weight:700}
  .card .body .d{font-size:12.5px;color:var(--tx2);margin:5px 0 11px;line-height:1.5}
  .card .row{display:flex;gap:14px;flex-wrap:wrap}
  .card .kv{font-size:12.5px;color:var(--tx3)}
  .card .kv b{font-size:15.5px;color:var(--tx);font-weight:700}
  .card .kv .u{color:var(--up)} .card .kv .dn{color:var(--down)}
  .card .go{position:absolute;right:14px;top:18px;font-size:13px;color:var(--tx3);font-weight:500;
            background:var(--chip);border:1px solid var(--line);padding:5px 11px;border-radius:8px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
  .dot.live{background:var(--down);box-shadow:0 0 0 3px rgba(13,163,92,.16);animation:pulse 1.8s infinite}
  .dot.warn{background:#e0a614;box-shadow:0 0 0 3px rgba(224,166,20,.16)}
  .dot.err{background:var(--up);box-shadow:0 0 0 3px rgba(225,59,59,.16)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .spark{max-width:820px;margin:18px auto 0;background:var(--card);border:1px solid var(--line);border-radius:15px;
         padding:14px 18px;box-shadow:0 2px 6px rgba(20,28,45,.05)}
  .spark h3{font-size:13px;color:var(--tx2);font-weight:600;margin-bottom:6px}
  .spark h3 .tag{font-size:11px;font-weight:500;color:var(--tx3);background:var(--chip);padding:2px 7px;border-radius:5px;margin-left:6px}
  #spark{width:100%;height:120px}
  .foot{max-width:820px;margin:20px auto 0;font-size:12px;color:var(--tx3);line-height:1.7}
</style>
</head>
<body>

<div class="head">
  <div class="logo">¥</div>
  <h1>行情看板<small>黄金 · A股 双入口</small></h1>
  <div class="spacer"></div>
  <div class="clock" id="clock">--:--:--<div class="date" id="cdate">--</div></div>
</div>

<div class="cards">
  <a class="card gold" href="/gold/">
    <div class="ic">Au</div>
    <div class="body">
      <div class="t">黄金实时走势</div>
      <div class="d">伦敦金现货 XAU/USD · 日K + 成交量，人民币/克 与 美元/盎司 切换</div>
      <div class="row">
        <div class="kv"><span class="dot warn" id="g-dot"></span><span id="g-price">--</span> <span style="font-size:11px">美元/盎司</span></div>
        <div class="kv" id="g-chg">--</div>
      </div>
    </div>
    <div class="go">进入 →</div>
  </a>

  <a class="card ashare" href="/ashare/">
    <div class="ic">A股</div>
    <div class="body">
      <div class="t">A股每日成交额</div>
      <div class="d">上证指数日K + 沪深两市每日成交总金额，红涨绿跌</div>
      <div class="row">
        <div class="kv"><span class="dot warn" id="a-dot"></span><span id="a-today">--</span> <span style="font-size:11px">今日两市</span></div>
        <div class="kv" id="a-yest">昨日 --</div>
      </div>
    </div>
    <div class="go">进入 →</div>
  </a>
</div>

<div class="spark">
  <h3>上证指数 · 近 60 日 <span class="tag">自动刷新</span></h3>
  <div id="spark"></div>
</div>

<div class="foot">
  数据来源：东方财富 / 新浪财经（浏览器直连，行情有延迟）。点击卡片进入完整看板。
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var UP='#e13b3b', DOWN='#0da35c', FLAT='#5c6679';

  /* 时钟 */
  function tick(){
    var d = new Date();
    var hh = String(d.getHours()).padStart(2,'0');
    var mm = String(d.getMinutes()).padStart(2,'0');
    var ss = String(d.getSeconds()).padStart(2,'0');
    $('clock').firstChild.textContent = hh+':'+mm+':'+ss;
    $('cdate').textContent = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  tick(); setInterval(tick, 1000);

  function fmtAmt(y){
    if(y==null||isNaN(y)) return '--';
    if(Math.abs(y)>=1e12) return (y/1e12).toFixed(2)+' 万亿';
    if(Math.abs(y)>=1e8)  return (y/1e8).toFixed(0)+' 亿';
    return (y/1e4).toFixed(0)+' 万';
  }

  /* 1. 黄金行情（本地服务代理，与黄金页同源） */
  function loadGold(){
    fetch('/api/quote?_=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.ok && j.xau){
          var p = j.xau, chg = p.change, pct = p.change_pct;
          $('g-price').textContent = p.price.toFixed(2);
          var cls = chg>0?'u':chg<0?'dn':'', sign = chg>0?'+':'';
          $('g-chg').innerHTML = '<b class="'+cls+'">'+sign+(chg).toFixed(2)+' ('+sign+pct.toFixed(2)+'%)</b>';
          $('g-dot').className = 'dot live';
          $('g-dot').title = '已连接';
        }
      })
      .catch(function(){ $('g-dot').className = 'dot err'; });
  }

  /* 2. A股行情（浏览器直连东财） */
  function loadAShare(){
    var EM_HIS = 'https://push2his.eastmoney.com/api/qt/stock/kline/get';
    var EM_REAL = 'https://push2.eastmoney.com/api/qt/stock/get';
    var now = new Date();
    var beg = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    Promise.all([
      fetch(EM_HIS+'?secid=1.000001&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57&klt=101&fqt=0&beg=20260101&end=20500101', {cache:'no-store'}).then(function(r){return r.json();}),
      fetch(EM_HIS+'?secid=0.399106&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57&klt=101&fqt=0&beg=20260101&end=20500101', {cache:'no-store'}).then(function(r){return r.json();}),
      fetch(EM_REAL+'?secid=1.000001&fields=f43,f44,f45,f46,f47,f48,f57,f58,f60,f170', {cache:'no-store'}).then(function(r){return r.json();}),
      fetch(EM_REAL+'?secid=0.399106&fields=f43,f44,f45,f46,f47,f48,f57,f58,f60,f170', {cache:'no-store'}).then(function(r){return r.json();})
    ]).then(function(res){
      var sh = parseK(res[0]), sz = parseK(res[1]);
      var szMap = {};
      for (var i=0;i<sz.length;i++) szMap[sz[i].date] = sz[i].amt;
      var shLast = sh[sh.length-1];
      var szLast = sz[sz.length-1];
      // 实时（如果交易日）
      var rsh = (res[2].data||{}), rsz = (res[3].data||{});
      var todayAmt = 0;
      if (rsh.f48 != null && rsz.f48 != null){
        todayAmt = (+rsh.f48) + (+rsz.f48);
      } else {
        todayAmt = (shLast.amtTot = shLast.amt + (szMap[shLast.date]||0));
      }
      // 昨日均值
      var yAmt = sh[sh.length-2] ? (sh[sh.length-2].amt + (szMap[sh[sh.length-2].date]||0)) : null;
      $('a-today').textContent = fmtAmt(todayAmt);
      $('a-yest').textContent = '昨日 ' + fmtAmt(yAmt);
      $('a-dot').className = 'dot live';
      $('a-dot').title = '已连接';
      renderSpark(sh, szMap);
    }).catch(function(){
      $('a-dot').className = 'dot err';
    });
  }

  function parseK(j){
    var out = [];
    var arr = (j && j.data && j.data.klines) || [];
    for (var i=0;i<arr.length;i++){
      var p = arr[i].split(',');
      out.push({date:p[0], o:+p[1], c:+p[2], h:+p[3], l:+p[4], vol:+p[5], amt:+p[6]});
    }
    return out;
  }

  /* 3. 迷你走势：上证收盘 + 两市成交额双轴 */
  var sparkChart = null;
  function renderSpark(sh, szMap){
    var rows = sh.slice(-60);
    var dates = rows.map(function(r){return r.date;});
    var closes = rows.map(function(r){return r.c;});
    var amts = rows.map(function(r){ return r.amt + (szMap[r.date]||0); });
    sparkChart = sparkChart || echarts.init($('spark'));
    sparkChart.setOption({
      animation:false,
      grid:{left:8, right:8, top:24, bottom:18, containLabel:true},
      tooltip:{trigger:'axis', axisPointer:{type:'cross'}, confine:true,
        backgroundColor:'rgba(255,255,255,.97)', borderColor:'#e6e9f0',
        textStyle:{color:'#1c2434', fontSize:12},
        formatter:function(ps){
          var d = ps[0].axisValue;
          var r = rows[ps[0].dataIndex];
          var h = '<b>'+d+'</b><br>';
          for (var i=0;i<ps.length;i++){
            var s = ps[i];
            var v = (s.seriesName==='上证') ? s.value.toFixed(2) : fmtAmt(s.value);
            h += s.marker + ' ' + s.seriesName + ' <b>'+v+'</b><br>';
          }
          return h;
        }
      },
      legend:{top:0, right:8, itemWidth:14, itemHeight:8, textStyle:{fontSize:11, color:'#8a93a5'}},
      xAxis:{type:'category', data:dates, boundaryGap:false, axisLabel:{fontSize:10, color:'#98a1b3'}, axisLine:{lineStyle:{color:'#e6e9f0'}}},
      yAxis:[
        {type:'value', scale:true, position:'left', splitLine:{lineStyle:{color:'#eef1f5'}}, axisLabel:{fontSize:10, color:'#98a1b3'}},
        {type:'value', scale:true, position:'right', splitLine:{show:false}, axisLabel:{fontSize:10, color:'#98a1b3',
          formatter:function(v){ return v>=1e12 ? (v/1e12).toFixed(1)+'万亿' : (v/1e8).toFixed(0)+'亿'; }}}
      ],
      dataZoom:[{type:'inside'}],
      series:[
        {name:'上证', type:'line', data:closes, smooth:true, symbol:'none',
         lineStyle:{width:1.6, color:'#e13b3b'}, itemStyle:{color:'#e13b3b'}},
        {name:'两市成交额', type:'bar', data:amts, xAxisIndex:0, yAxisIndex:1,
         barMaxWidth:8, itemStyle:{color:function(p){
            var a = amts[p.dataIndex], b = p.dataIndex>0 ? amts[p.dataIndex-1] : null;
            return b==null ? '#c9971f' : (a>=b ? 'rgba(225,59,59,.6)' : 'rgba(13,163,92,.6)');
         }}}
      ]
    }, true);
  }

  /* 启动 + 定时 */
  loadGold(); loadAShare();
  setInterval(loadGold, 30000);
  setInterval(loadAShare, 30000);
  window.addEventListener('resize', function(){ if (sparkChart) sparkChart.resize(); });
})();
</script>
</body>
</html>
