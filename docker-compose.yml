# 用法一：在本目录执行  docker compose up -d --build
# 用法二（飞牛 fnOS 等 NAS 图形界面）：
#   Docker → Compose → 新增项目 → 路径选本项目目录 → 来源选「创建 docker-compose.yml」
#   → 把本文件内容粘进去 → 勾选「创建项目后立即启动」→ 确定
#   注意：项目目录里必须同时有 Dockerfile、gold_server.py 和 gold/ 子目录，
#         否则构建会失败（详见 README 的飞牛部署章节）
services:
  gold:
    build: .
    image: gold-dashboard:1.0
    container_name: gold-dashboard
    restart: unless-stopped
    ports:
      # IPv4 映射（容器内是 IPv6 双栈监听，IPv4 也能连）
      - "8765:8765"
      # 需要 IPv6 访问时再加下面这一行（要求 Docker daemon 已开启 IPv6，见 README）：
      # - "[::]:8765:8765"
    environment:
      TZ: Asia/Shanghai
      GOLD_HOST: "::"        # IPv6 双栈：同一个 socket 同时接受 IPv4 与 IPv6
      GOLD_PORT: 8765        # 容器内端口，改这里要同步改 ports 右侧
      PAGES: "/gold/:gold,/ashare/:ashare"   # 导航 / + 黄金 /gold/ + A股 /ashare/
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('GOLD_PORT','8765')+'/api/ping',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

# 想让容器直接用宿主机网络栈（IPv4/IPv6 自动全通，Linux 适用），改成：
