services:
  gold:
    build: .
    image: gold-dashboard:1.0
    container_name: gold-dashboard
    restart: unless-stopped
    ports:
      # IPv4 映射（容器内是 IPv6 双栈监听，IPv4 也能连）
      - "8765:8765"
      # 需要 IPv6 访问时再加下面这一行（要求 Docker daemon 已开启 IPv6，见 README）：
      # - "[::]:8765:8765"
    environment:
      TZ: Asia/Shanghai
      GOLD_HOST: "::"        # IPv6 双栈：同一个 socket 同时接受 IPv4 与 IPv6
      GOLD_PORT: 8765        # 容器内端口，改这里要同步改 ports 右侧
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('GOLD_PORT','8765')+'/api/ping',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

# 想让容器直接用宿主机网络栈（IPv4/IPv6 自动全通，Linux 适用），改成：
# services:
#   gold:
#     build: .
#     image: gold-dashboard:1.0
#     container_name: gold-dashboard
#     restart: unless-stopped
#     network_mode: host
#     environment:
#       TZ: Asia/Shanghai
#       GOLD_HOST: "::"
#       GOLD_PORT: 8765
